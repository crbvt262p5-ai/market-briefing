# 수집 대상 채널: @username, t.me 링크, 또는 채널 ID 를 나열하세요.
# 비공개 채널은 본인 계정이 구독(가입)되어 있어야 읽을 수 있습니다.
channels:
  # 시황 / 전략 / 매크로
  - "@globalmktinsight"   # 미래에셋 시황 김석환
  - "@hedgecat0301"       # 키움 전략/시황 한지영
  - "@Meritz_strategy"    # 메리츠 투자전략팀
  - "@sypark_strategy"    # 신영 박소연
  - "@daishinstrategy"    # 대신 전략 돌직구
  - "@eqmirae"            # 미래에셋 전략/퀀트 유명간
  - "@hanwhastrategy"     # 한화 투자전략팀
  # 미국주식 / 해외
  - "@kwusa"              # 키움 미국주식 톡톡
  - "@hana_us_stock"      # 하나 미국주식 강재구
  - "@globaletfi"         # 하나 Global ETF 박승진
  # 반도체 / 테크
  - "@KISemicon"          # 한투 테크팀
  - "@kiwoom_semibat"     # 키움 반도체/이차전지
  # 해외선물 / 글로벌 뉴스 (물량 多 — 주요 뉴스 선별 대상)
  - "@kwtok"              # 키움증권 해외선물 톡톡
  # 채권
  - "@deandatbond"        # 하나 해외채권 허성우
  # 종합 리포트 / 뉴스
  - "@companyreport"      # 증권사 리포트
  - "@hankyung_fin"       # 한국경제

# 하루 3회 시간대 분할 실행. name=KST 기준 시각(시), lookback_hours=직전 슬롯 이후 범위.
# 07시=전날 17시~(밤사이 미국장), 12시=07시~, 17시=12시~ (중복 없음)
# ai: true 인 슬롯만 유료 Claude(피드요약+AI 브리핑) 사용. false 면 무료 키워드 핵심으로 대체.
# 비용절감: 가장 중요한 밤사이(07시)만 AI, 장중은 무료 핵심. (기본 미지정 시 true)
slots:
  - { name: "07", lookback_hours: 14, ai: true }
  - { name: "12", lookback_hours: 5,  ai: false }
  - { name: "17", lookback_hours: 5,  ai: false }

# 수집에서 제외할 노이즈 패턴(부분일치). 키움 해외선물의 [AI시그널] 자동 기술분석 도배 등.
exclude_patterns:
  - "[AI시그널]"
  - "[AI 시그널]"

# 수집 범위 기본값(시간). slots/--slot 으로 슬롯 실행 시에는 슬롯별 lookback 이 우선합니다.
lookback_hours: 24

# 타임존 (출력 timestamp 표기에 사용)
timezone: "Asia/Seoul"

# 브리핑 결과물(.md)과 원본(.json) 저장 폴더
output_dir: "briefings"

# 텔레그램 전달 대상. "me" = 본인 Saved Messages.
# 특정 채널/봇으로 보내려면 @username 또는 채널 ID 로 교체하세요.
deliver_to: "me"

# 직전 브리핑의 TL;DR 을 다음 브리핑에 맥락으로 전달(패턴 분석 연속성)
keep_previous_summary: true

# 특별히 주목할 종목/섹터/이슈 (선택). 비워두면 무시됩니다.
focus: ""

# 채널당 최대 수집 메시지 수 (lookback 안에서도 안전장치)
max_messages_per_channel: 200

# 텔레그램 메시지 하단에 넣을 대시보드 주소
dashboard_url: "https://crbvt262p5-ai.github.io/market-briefing/"

# 대시보드 '핵심 브리핑' 하단 '특수 관심 키워드' 섹션. 이 키워드가 언급된 그날
# 뉴스·리포트만 모아서 원문 링크와 함께 보여줌(무료, AI 미사용). 자유롭게 추가/삭제.
watch_terms:
  - "광물"
  - "배터리"
  - "이차전지"
  - "반도체"
  - "ESS"
  - "에너지"
  - "EV"
  - "BEV"
  - "전기차"
  - "리튬"
